creation_rules:
  # SleeperService's secrets, made before the host exists: admin keys only.
  # Add its host key here and run sops updatekeys once it is provisioned.
  - path_regex: secrets/sleeperservice/[^/]+\.(yaml|json|env|ini)$
    key_groups:
    - age:
      - *admin_yubikey_37817094
      - *admin_yubikey_37817095
      - *admin_paper
  - path_regex: secrets/[^/]+\.(yaml|json|env|ini)$
    key_groups:
    - age:
      - *server_aegis
      - *admin_yubikey_37817094
      - *admin_yubikey_37817095
      - *admin_paper
