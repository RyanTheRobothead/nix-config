# Vulnerabilities with no fixed image yet, and what to undo once there is one
# (Phase 6 Stage A). vulnscan posts once when every listed container runs a
# fixed version, and the daily summary shows each watch still waiting.
#
# `fixed` is the upstream release. Alpine and Debian often backport a fix
# without it (8.5.11-r1), so when Grype starts reporting one of `cves` with a
# fixed version for a watched container, that version is the threshold
# instead.

# No watches open. An entry looks like:
#
# [[watch]]
# name = "PHP2Shell"
# cves = ["CVE-2026-109618", "CVE-2026-109619"]
# purls = ["pkg:apk/alpine/php85"]
# containers = ["cerberus/swag", "aegis/nextcloud"]
# fixed = "8.5.12"
# then = "Revert the lockdown: ..."
