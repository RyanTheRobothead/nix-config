# Vulnerabilities with no fixed image yet, and what to undo once there is one
# (Phase 6 Stage A). vulnscan posts once when every listed container runs a
# fixed version, and the weekly summary shows each watch still waiting.
#
# A container waits while Grype still matches one of `cves` in it, and is
# fixed once Grype matches it elsewhere in the watch but not there. `fixed`,
# the upstream release, is optional: it decides only when Grype matches the
# CVE nowhere, as when it isn't in Grype's data yet (PHP2Shell on its first
# day). Leave it out when Grype already knows the CVE.

# An entry looks like:
#
# [[watch]]
# name = "PHP2Shell"
# cves = ["CVE-2026-109618", "CVE-2026-109619"]
# purls = ["pkg:apk/alpine/php85"]
# containers = ["cerberus/swag", "aegis/nextcloud"]
# fixed = "8.5.12"
# then = "Revert the lockdown: ..."

[[watch]]
name = "brotli (CVE-2026-111497)"
# Known exploited. Debian and Ubuntu have fixed packages; these images
# haven't been rebuilt on them yet. Grype knows the CVE, so no `fixed`.
# Foundry isn't listed: Alpine 3.18 has no fixed brotli-libs, so it needs
# a newer image, not a rebuild.
cves = ["CVE-2026-111497"]
purls = ["pkg:deb/debian/libbrotli1", "pkg:deb/ubuntu/libbrotli1"]
containers = [
  "aegis/immich_server",
  "aegis/vaultwarden",
  "aegis/jellyfin",
  "aegis/ombi",
  "aegis/plex",
]
then = "Nothing to undo: once Renovate brings in the rebuilt images, delete this watch."
